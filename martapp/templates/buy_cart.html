<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .cart-container {
            background: #ffffff;
            padding: 30px 40px;
            max-width: 750px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #1f2937;
        }

        .cart-item {
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item strong {
            font-size: 18px;
            color: #111827;
        }

        .cart-item span {
            display: inline-block;
            margin-top: 5px;
            color: #4b5563;
        }

        label {
            display: inline-block;
            margin-top: 10px;
            font-weight: 500;
            color: #374151;
        }

        input[type="number"] {
            margin-top: 5px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            width: 80px;
        }

        .buy-button {
            margin-top: 25px;
            padding: 12px 25px;
            background: #10b981;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .buy-button:hover {
            background: #059669;
        }

        .remove-btn {
            display: inline-block;
            margin-top: 12px;
            color: #ef4444;
            font-size: 14px;
            text-decoration: underline;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #6b7280;
            background: #e5e7eb;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: #d1d5db;
        }

        p {
            text-align: center;
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h2>Your Cart</h2>
        <a href="{% url 'dashboard' %}" class="back-button">← Back to Dashboard</a>

        {% if cart_items %}
            <form method="POST" action="{% url 'buy-cart' %}">
                {% csrf_token %}
                {% for item in cart_items %}
                    <div class="cart-item">
                        <strong>{{ item.product.product_name }}</strong><br>
                        <span>Seller: {{ item.product.seller.user }}</span><br>
                        <span>Price: ₹{{ item.product.price }}</span><br>
                        <span>Stock: {{ item.product.stock }}</span><br>

                        <label for="qty_{{ item.id }}">Quantity:</label><br>
                        <input type="number" name="quantities[{{ item.id }}]" id="qty_{{ item.id }}"
                            value="{{ item.quantity }}" min="1" max="{{ item.product.stock }}">

                        <br>
                        <a class="remove-btn" href="{% url 'remove-from-cart' item.product.id %}">Remove</a>
                    </div>
                {% endfor %}

                <button class="buy-button" type="submit">Buy All</button>
            </form>
        {% else %}
            <p>Your cart is empty.</p>
        {% endif %}
    </div>
</body>
</html>
