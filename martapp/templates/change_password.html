{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password (Custom)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f1f1f1;
        }

        .centered-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background-color: #1e1e1e;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #00bfff;
        }

        form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #f1f1f1;
        }

        form label {
            font-weight: bold;
        }

        button,
        .back-link,
        .profile-link {
            width: 100%;
            display: inline-block;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        button {
            background-color: #00bfff;
            color: white;
        }

        button:hover {
            background-color: #009acd;
        }

        .back-link,
        .profile-link {
            background-color: #333;
            color: white;
        }

        .back-link:hover,
        .profile-link:hover {
            background-color: #555;
        }

        ul {
            margin-top: 15px;
            padding: 0;
            list-style: none;
            color: #ff7070;
        }

        li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
<div class="centered-container">
    <div class="form-box">
        <h2>Change Password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>

        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <a href="javascript:history.back()" class="back-link">Go Back</a>
        <a href="{% url 'profile' %}" class="profile-link">Back to Profile</a>
    </div>
</div>
</body>
</html>
