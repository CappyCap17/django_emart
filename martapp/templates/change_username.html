{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Username</title>
    <link rel="stylesheet" href="{% static 'martapp/dashboard.css' %}">
</head>
<body>
    <div class="dashboard-container">
        <h2>Change Username</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Save New Username</button>
        </form>

        <a href="{% url 'profile' %}" class="btn">Back to Profile</a>
    </div>
</body>
</html>
