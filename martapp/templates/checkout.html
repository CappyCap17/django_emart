{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - {{ product.product_name }}</title>
    <link rel="stylesheet" href="{% static 'martapp/css/styles.css' %}">
</head>
<body>
    <div class="messages">
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="buy-container">
        <div class="product-image">
            <img src="data:image/jpeg;base64,{{ product_image_base64 }}" alt="{{ product.product_name }}">
        </div>

        <div class="product-info">
            <h2>{{ product.product_name }}</h2>
            <p><strong>Price:</strong> ₹{{ product.price }}</p>
            <p><strong>Quantity:</strong> {{ quantity }}</p>
            <p>Total Price: ₹{{ total_price }}</p>


            <form method="POST" action="{% url 'confirm_purchase' product.id %}">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="{{ quantity }}">
                
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br>

                <label for="city">City:</label>
                <input type="text" id="city" name="city" required><br>

                <label for="pincode">Pincode:</label>
                <input type="text" id="pincode" name="pincode" required><br>

                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required><br>

                <label for="payment_mode">Mode of Payment:</label>
                <select id="payment_mode" name="payment_mode" required>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Credit Card">Credit Card</option>
                </select><br>

                <button type="submit" class="buy-btn">Confirm Purchase</button>
            </form>
        </div>
    </div>

    <a href="{% url 'buy_product' product.id %}" class="back-button">Back to Product</a>
</body>
</html>
