{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Emart</title>
    <link rel="stylesheet" href="{% static 'martapp/dashboard.css' %}">
</head>
<body>
    <div class="dashboard-container">

        <div class="top-container">
            <div class="logo" onclick="location.reload()">
                <img src="{% static 'martapp/images/logo.png' %}" alt="Emart Logo">
                <h1>Emart</h1>
            </div>

            <div class="search-section">
                <form method="GET" action="{% url 'search' %}">
                    <input type="text" name="q" placeholder="Search products..." class="search-bar">
                    <button type="submit" class="search-btn">Search</button>
                </form>
            </div>

            <div class="nav-buttons">
                <a href="{% url 'profile' %}" class="btn">Profile</a>
                <a href="{% url 'logout' %}" class="btn logout">Logout</a>
                <a href="{% url 'view-cart' %}" class="cart-button">Cart</a>

            </div>
        </div>

        <div class="bottom-container">
            {% for product in recommended_products %}
                <div class="product-card">
                    
                        <img src="data:image/png;base64,{{ product.image_base64 }}" alt="{{ product.product_name }}">
                        <h3>{{ product.product_name }}</h3>
                        <p>Seller: {{ product.seller_name.username }}</p>
                        <p>₹{{ product.price }}</p>
                        <a href="{% url 'buy_product' product.id %}" class="product-link">Buy</a> 
                </div> 
            {% endfor %}
        </div>

    </div>
</body>
</html>
