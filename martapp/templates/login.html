{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'martapp/style.css' %}">
</head>

<body>
    <a href="javascript:history.back()" class="back-button">Back</a>
    <div class="form-container">
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <h2>Login</h2>


            <label for="username">Username:</label><br />
            <input type="text" id="username" name="username" placeholder="Enter your username" required><br /><br />


            <label for="password">Password:</label><br />
            <input type="password" id="password" name="password" minlength="6" placeholder="Enter your password" required><br /><br />


            <button type="submit">Submit</button>

       
            <p>Don't have an account yet? <a href="/register/">Register</a></p>
        </form>
        <a href="{% url 'social:begin' 'google-oauth2' %}?next=/dashboard/">
            <img src="{% static 'martapp/images/google_login.png' %}" alt="Login with Google" style="width: 350px; height: auto; margin-top: 20px;">

        </a>
        
    </div>
</body>

</html>
