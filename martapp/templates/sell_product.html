{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell a Product - Emart</title>
    <link rel="stylesheet" href="{% static 'martapp/style-dark.css' %}">
</head>
<body>
    <a href="javascript:history.back()" class="back-button">Back</a>
    <div class="sell-container">
        <h1>Sell a New Product</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
        
            {{ form.seller_name }}  <!-- ✅ Required even if it's hidden! -->
            
            <div>
                <label for="id_product_name">Product Name:</label>
                {{ form.product_name }}
            </div>
        
            <div>
                <label for="id_product_image">Product Image:</label>
                {{ form.product_image }}
            </div>
        
            <div>
                <label for="id_product_type">Product Type:</label>
                {{ form.product_type }}
            </div>
        
            <div>
                <label for="id_price">Price (₹):</label>
                {{ form.price }}
            </div>
        
            <div>
                <label for="id_description">Description:</label>
                {{ form.description }}
            </div>
        
            <button type="submit">List Product</button>
        </form>
        
        <br>
        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>
</body>
</html>
